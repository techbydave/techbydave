name: Daily newsletter digest

on:
  # Main trigger: "Publish edited drafts" starts this right after a post goes live.
  # The schedule below is only a safety net (about 6-7pm Toronto) for anything
  # published another way. It never double-sends: the script skips a digest
  # Kit already has.
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python scripts/send_daily_digest.py
